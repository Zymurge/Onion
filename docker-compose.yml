services:
  migrate:
    image: onion-migrate:local
    build:
      context: .
      dockerfile: Dockerfile.migrate
    command:
      - --wait
      - --wait-timeout=60s
      - --migrations-dir=/db/migrations
      - --migrations-table=dbmate_schema_migrations
      - migrate
    environment:
      DATABASE_URL: postgres://onion:onionpass@db:5432/onion?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_MIGRATIONS_TABLE: dbmate_schema_migrations
    depends_on:
      db:
        condition: service_healthy

  engine:
    build:
      context: .
      args:
        ENGINE_PORT: ${ENGINE_PORT:?Set ENGINE_PORT in .env or the environment}
    ports:
      - "${ENGINE_PORT:?Set ENGINE_PORT in .env or the environment}:${ENGINE_PORT:?Set ENGINE_PORT in .env or the environment}"
    volumes:
      - ./scenarios:/app/scenarios:ro
    environment:
      DATABASE_URL: postgres://onion:onionpass@db:5432/onion
      JWT_SECRET: orgres are like onions, but not at all like parfait, despite what donkey says
      ENGINE_HOST: ${ENGINE_HOST:?Set ENGINE_HOST in .env or the environment}
      ENGINE_PORT: ${ENGINE_PORT:?Set ENGINE_PORT in .env or the environment}
      NODE_ENV: production
      SCENARIOS_DIR: /app/scenarios
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOBBY_POLL_INTERVAL_MS: ${LOBBY_POLL_INTERVAL_MS:-3000}
      PRESENCE_DISCONNECT_GRACE_MS: ${PRESENCE_DISCONNECT_GRACE_MS:-3000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: onion-db
    environment:
      POSTGRES_USER: onion
      POSTGRES_PASSWORD: onionpass
      POSTGRES_DB: onion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onion"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
